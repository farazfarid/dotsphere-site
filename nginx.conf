server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;
  server_tokens off;
  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;

  # Alles kommt von dieser Domain, keine Inline-Skripte oder -Stile (Stile setzt das Skript über das CSSOM)
  set $csp "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'";

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy $csp always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

  location ~ ^/(impressum|datenschutz)$ { return 301 /$1/; }

  location /assets/ {
    add_header Cache-Control "public, max-age=600" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy $csp always;
  }
  location ~* \.(svg|png|txt|xml)$ {
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options nosniff always;
  }
  location / {
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy $csp always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  }
}
